# Run on the EC2 instance to pull both images from ECR and keep them
# running. Copy .env.example to .env and fill it in first. If you're not
# using Red Flag Court video uploads, delete the court-upload service below
# (it needs COURT_BUCKET and S3 permissions the relay itself doesn't).
services:
  relay:
    image: ${ECR_REGISTRY}/fittrack-relay:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8787:8787"
    environment:
      - PORT=8787

  court-upload:
    image: ${ECR_REGISTRY}/fittrack-court-upload:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8788:8788"
    environment:
      - COURT_UPLOAD_PORT=8788
      - COURT_BUCKET=${COURT_BUCKET}
      - AWS_REGION=${AWS_REGION}
    # No AWS keys here on purpose — credentials come from the EC2 instance's
    # IAM role via the metadata service. See README's IMDS hop-limit note.
